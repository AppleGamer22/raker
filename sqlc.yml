# yaml-language-server: $schema=https://json.schemastore.org/sqlc-2.0.json
# https://youtu.be/VX6KzpjaPp8
version: "2"
sql:
  - engine: postgresql
    schema: ./db/schemas
    queries: ./db/queries
    gen:
      go:
        package: db
        out: ./server/db
        emit_json_tags: true
        emit_prepared_queries: true
        emit_interface: true
        emit_enum_valid_method: true
        # emit_all_enum_values: true
        emit_pointers_for_null_types: true
        rename:
          urls: URLs
          PostType: PostType
        overrides:
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: point
            nullable: true
            go_type:
              import: github.com/AppleGamer22/raker/server/db/types
              type: NullPoint
